name: PHP checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
      - run: find app tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: php -l wk-fluent-multireservation.php && php -l autoload.php
      - run: php tests/unit.php
